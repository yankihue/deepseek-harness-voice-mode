name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  voice-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run voice-link tests
        working-directory: voice-link
        # dependency-free: no install step required
        run: node --test
      - name: Verify shipped plugin bundles
        run: |
          node --check packages/orchestrator/host.js
          node --check packages/orchestrator/plugin.cjs
          node --check packages/client/lib/client.js
          node --test test/release-contract.test.js
