name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  voice-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run voice-link tests
        working-directory: voice-link
        # dependency-free: no install step required
        run: node --test